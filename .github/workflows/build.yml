# ALSA Pizarra para Android TV
# Este único archivo arma la app, la compila y la publica en "Releases".
# Para compilar de nuevo: pestaña Actions -> "Compilar ALSA Pizarra" -> Run workflow.

name: Compilar ALSA Pizarra

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Armar el proyecto
        run: |
          set -e
          mkdir -p app/src/main/java/ar/com/alsacambios/pizarra
          cd app

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'alsa-pizarra'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'ar.com.alsacambios.pizarra'
              compileSdk 34
              defaultConfig {
                  applicationId 'ar.com.alsacambios.pizarra'
                  minSdk 21
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
                  versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="ALSA Pizarra"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > src/main/java/ar/com/alsacambios/pizarra/BootReceiver.java <<'EOF'
          package ar.com.alsacambios.pizarra;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /* Al prender la tele abre la pizarra sola. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  Intent abrir = new Intent(c, MainActivity.class);
                  abrir.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try { c.startActivity(abrir); } catch (Exception e) { }
              }
          }
          EOF

          cat > src/main/java/ar/com/alsacambios/pizarra/MainActivity.java <<'EOF'
          package ar.com.alsacambios.pizarra;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              static final String URL = "https://pizarra.alsacambios.com.ar/";
              static final long REINTENTO_MS = 15000;              // sin internet: reintenta cada 15 segundos
              static final long RECARGA_MS = 6L * 60 * 60 * 1000;  // recarga preventiva cada 6 horas

              WebView web;
              final Handler h = new Handler(Looper.getMainLooper());
              long ultimoAtras = 0;

              final Runnable recargar = new Runnable() {
                  @Override public void run() { if (web != null) web.loadUrl(URL); }
              };
              final Runnable recargaPeriodica = new Runnable() {
                  @Override public void run() { recargar.run(); h.postDelayed(this, RECARGA_MS); }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0D1716);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          if (url != null && url.startsWith("https://")) {
                              // en la app ya es pantalla completa: se oculta el botón de la página
                              v.evaluateJavascript("(function(){var st=document.createElement('style');st.textContent='#btnFull{display:none!important}';document.head.appendChild(st)})()", null);
                          }
                      }
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (Build.VERSION.SDK_INT >= 21 && r.isForMainFrame()) sinConexion();
                      }
                      @SuppressWarnings("deprecation")
                      @Override
                      public void onReceivedError(WebView v, int code, String desc, String failingUrl) {
                          if (Build.VERSION.SDK_INT < 23) sinConexion();
                      }
                      @Override
                      public boolean onRenderProcessGone(WebView v, RenderProcessGoneDetail d) {
                          recreate();
                          return true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl(URL);
                  h.postDelayed(recargaPeriodica, RECARGA_MS);
                  pedirPermisoArranque();
              }

              void sinConexion() {
                  web.loadDataWithBaseURL(null,
                      "<html><body style='margin:0;background:#0d1716;color:#cfe;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center'>"
                      + "<div><h1 style='font-size:48px;margin:0 0 16px'>ALSA CAMBIOS</h1>"
                      + "<p style='font-size:28px;margin:0'>Sin conexión a internet. Reintentando…</p></div></body></html>",
                      "text/html", "utf-8", null);
                  h.removeCallbacks(recargar);
                  h.postDelayed(recargar, REINTENTO_MS);
              }

              /* Para abrirse sola al prender la tele, Android 10 o más nuevo pide "Mostrar sobre otras apps". Se pide una sola vez. */
              void pedirPermisoArranque() {
                  if (Build.VERSION.SDK_INT < 29) return;
                  if (Settings.canDrawOverlays(this)) return;
                  SharedPreferences p = getSharedPreferences("alsa", MODE_PRIVATE);
                  if (p.getBoolean("pidioPermiso", false)) return;
                  p.edit().putBoolean("pidioPermiso", true).apply();
                  try {
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      Toast.makeText(this, "Activá ALSA Pizarra para que se abra sola al prender la tele", Toast.LENGTH_LONG).show();
                  } catch (Exception e) { }
              }

              void pantallaCompleta() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override
              public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) pantallaCompleta();
              }

              @Override
              public boolean onKeyDown(int code, KeyEvent e) {
                  // OK / Enter del control: recarga la pizarra
                  if (code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER) {
                      recargar.run();
                      return true;
                  }
                  // Atrás: hay que apretarlo dos veces para salir (evita salir sin querer)
                  if (code == KeyEvent.KEYCODE_BACK) {
                      long ahora = System.currentTimeMillis();
                      if (ahora - ultimoAtras < 2500) { finish(); return true; }
                      ultimoAtras = ahora;
                      Toast.makeText(this, "Apretá Atrás otra vez para salir", Toast.LENGTH_SHORT).show();
                      return true;
                  }
                  return super.onKeyDown(code, e);
              }

              @Override
              protected void onResume() { super.onResume(); if (web != null) web.onResume(); pantallaCompleta(); }

              @Override
              protected void onPause() { if (web != null) web.onPause(); super.onPause(); }

              @Override
              protected void onDestroy() {
                  h.removeCallbacksAndMessages(null);
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }
          }
          EOF

      - name: Armar ícono y banner con el logo
        run: |
          set -e
          pip install --quiet pillow
          curl -fsSL https://pizarra.alsacambios.com.ar/icon-512.png -o logo.png
          mkdir -p app/src/main/res/mipmap-xhdpi app/src/main/res/drawable-xhdpi
          python3 - <<'EOF'
          from PIL import Image, ImageDraw, ImageFont
          logo = Image.open('logo.png').convert('RGBA')
          logo.resize((96, 96), Image.LANCZOS).save('app/src/main/res/mipmap-xhdpi/ic_launcher.png')
          W, H = 640, 360
          b = Image.new('RGBA', (W, H), (13, 23, 22, 255))
          l = logo.resize((230, 230), Image.LANCZOS)
          b.paste(l, (40, (H - 230) // 2), l)
          d = ImageDraw.Draw(b)
          def fuente(nombre, tam):
              for ruta in ('/usr/share/fonts/truetype/dejavu/' + nombre, '/usr/share/fonts/truetype/' + nombre):
                  try:
                      return ImageFont.truetype(ruta, tam)
                  except Exception:
                      pass
              return ImageFont.load_default(size=tam)
          d.text((300, 120), 'Pizarra', font=fuente('DejaVuSans-Bold.ttf', 72), fill=(255, 255, 255, 255))
          d.text((304, 212), 'Cotizaciones', font=fuente('DejaVuSans.ttf', 34), fill=(120, 220, 200, 255))
          b.save('app/src/main/res/drawable-xhdpi/banner.png')
          EOF

      - name: Compilar
        working-directory: app
        run: gradle assembleDebug --no-daemon

      - name: Preparar archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk ALSA-Pizarra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ALSA-Pizarra
          path: ALSA-Pizarra.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: ALSA Pizarra 1.${{ github.run_number }}
          files: ALSA-Pizarra.apk
          make_latest: true
